<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pyxel Video Player</title>
    <style>
        /* 動画再生用のスタイル */
        #movie-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="movie-overlay">
        <video id="game-video" src=""></video>
    </div>

    <script>
        function playMovie(filename) {
            const overlay = document.getElementById('movie-overlay');
            const video = document.getElementById('game-video');

            video.src = filename;
            overlay.style.display = 'flex';

            video.play().catch(error => {
                console.error("動画再生エラー（画面をクリックしてからお試しください）:", error);
                finishMovie(overlay, video);
            });

            // 動画が終了したときのイベント
            video.onended = function() {
                finishMovie(overlay, video);
            };
        }

        function finishMovie(overlay, video) {
            overlay.style.display = 'none';
            video.src = ""; 

            // Python側の movie_finished() メソッドを直接呼び出す
            if (window.pyxel_app && typeof window.pyxel_app.movie_finished === 'function') {
                window.pyxel_app.movie_finished();
            }
        }
    </script>
</body>
</html>
