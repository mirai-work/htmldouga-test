<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pyxel Video Player</title>
    <style>
        /* 動画再生用のスタイル（画面中央に配置） */
        #movie-overlay {
            display: none; /* 通常時は非表示 */
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999; /* Pyxelの画面より手前に表示 */
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="movie-overlay">
        <video id="game-video" src=""></video>
    </div>

    <script>
        // Python側から呼び出されるグローバル関数
        function playMovie(filename, callback) {
            const overlay = document.getElementById('movie-overlay');
            const video = document.getElementById('game-video');

            // 動画のパスを設定して表示
            video.src = filename;
            overlay.style.display = 'flex';

            // 動画を再生
            video.play().catch(error => {
                console.error("動画の再生に失敗しました。ブラウザのジェスチャー制限の可能性があります:", error);
                // 失敗した場合は即座に終了処理へ
                finishMovie(overlay, video, callback);
            });

            // 動画が最後まで再生された時のイベント
            video.onended = function() {
                finishMovie(overlay, video, callback);
            };
        }

        // 動画終了時の共通処理
        function finishMovie(overlay, video, callback) {
            // 動画を非表示にして停止
            overlay.style.display = 'none';
            video.src = ""; 

            // Python側の movie_finished メソッドを実行
            if (callback) {
                callback();
            }
        }
    </script>
</body>
</html>
