<!DOCTYPE html>

<html lang="ja">

<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

<script>

function playMovie(filename, callbackName = null) {

    const oldVideo = document.getElementById("moviePlayer");
    if (oldVideo) oldVideo.remove();

    const video = document.createElement("video");

    video.id = "moviePlayer";
    video.src = filename;

    video.autoplay = true;
    video.controls = false;
    video.playsInline = true;

    video.style.position = "fixed";
    video.style.left = "0";
    video.style.top = "0";
    video.style.width = "100vw";
    video.style.height = "100vh";
    video.style.objectFit = "contain";
    video.style.background = "black";
    video.style.zIndex = "9999";

    document.body.appendChild(video);

    video.onended = function () {

        video.remove();

        if (
            callbackName &&
            window.pyxel_app &&
            typeof window.pyxel_app[callbackName] === "function"
        ) {
            window.pyxel_app[callbackName]();
        }
    };

    video.onerror = function () {

        console.log("Movie Error");

        video.remove();

        if (
            callbackName &&
            window.pyxel_app &&
            typeof window.pyxel_app[callbackName] === "function"
        ) {
            window.pyxel_app[callbackName]();
        }
    };
}

</script>

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:black;
}

</style>

</head>

<body>

<pyxel-run
 name="gamehyoujyun.py"
 gamepad="enabled"> </pyxel-run>

</body>

</html>
