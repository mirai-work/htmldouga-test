<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

<script>

function showImage(filename, callbackName = null) {

    const oldImg = document.getElementById("photoViewer");
    if (oldImg) oldImg.remove();

    const img = document.createElement("img");

    img.id = "photoViewer";
    img.src = filename;

    img.style.position = "fixed";
    img.style.left = "0";
    img.style.top = "0";
    img.style.width = "100vw";
    img.style.height = "100vh";
    img.style.objectFit = "contain";
    img.style.background = "black";
    img.style.zIndex = "9999";

    document.body.appendChild(img);

    img.onclick = function() {

        img.remove();

        if (
            callbackName &&
            window.pyxel_app &&
            typeof window.pyxel_app[callbackName] === "function"
        ) {
            window.pyxel_app[callbackName]();
        }
    };
}

</script>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:black;
}
</style>

</head>

<body>

<pyxel-run
 name="game.py"
 gamepad="enabled"> </pyxel-run>

</body>
</html>
